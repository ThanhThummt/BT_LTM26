# ===================================================================
# Database Configuration (Local MySQL via XAMPP/phpMyAdmin)
# ===================================================================
db.host=localhost
db.port=3306
db.name=student_db
db.user=root
db.password=

# ===================================================================
# Network Configuration
# ===================================================================
# Port that this computer will listen on for incoming sync connections
server.port=8888

# Remote Peer Configuration (The other computer)
# NOTE: Replace with the actual LAN IP of the other machine (e.g. 192.168.1.100).
# DO NOT use 'localhost' when connecting between two different computers.
peer.host=192.168.1.100
peer.port=8888

# Socket timeout in milliseconds (e.g. 5000 = 5 seconds)
network.timeout=5000
